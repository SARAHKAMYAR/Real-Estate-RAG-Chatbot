<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noorderlicht Makelaars Assistant</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1c2321; --muted: #66706c; --line: #e2e0d8;
    --accent: #1f5f4a; --accent-ink: #ffffff; --user: #e7efe9; --chip: #e9f1ed;
    --doc: #1f5f4a; --listing: #8a5a12; --web: #2b5c9a; --error: #a3312a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141816; --panel: #1c211f; --ink: #e8ebe8; --muted: #9aa5a0; --line: #2d3531;
      --accent: #6cc3a3; --accent-ink: #0f1513; --user: #24302b; --chip: #24302b;
      --doc: #6cc3a3; --listing: #e0b060; --web: #86b4ee; --error: #f08a80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 0 16px; min-height: 100dvh;
         display: flex; flex-direction: column; }
  header { padding: 24px 0 12px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 1.15rem; margin: 0; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }
  #log { flex: 1; padding: 20px 0; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 92%; }
  .msg.user { align-self: flex-end; background: var(--user); padding: 10px 14px; border-radius: 14px 14px 4px 14px; }
  .msg.bot { align-self: flex-start; }
  .bubble { background: var(--panel); border: 1px solid var(--line); padding: 12px 16px;
            border-radius: 14px 14px 14px 4px; }
  .bubble p { margin: 0 0 0.6em; } .bubble p:last-child { margin-bottom: 0; }
  .bubble ul { margin: 0 0 0.6em; padding-left: 1.2em; }
  .cite { display: inline-block; min-width: 1.5em; padding: 0 5px; margin: 0 1px; border: 0;
          border-radius: 6px; background: var(--chip); color: var(--accent); font: inherit;
          font-size: 0.78em; font-weight: 600; cursor: pointer; vertical-align: 1px; }
  .sources { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .sources li { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
                font-size: 0.86rem; overflow: hidden; }
  .sources li.flash { outline: 2px solid var(--accent); }
  .sources summary { padding: 8px 12px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  .sources .ref { font-weight: 700; color: var(--accent); }
  .sources .kind { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
  .kind.document { color: var(--doc); } .kind.listing { color: var(--listing); } .kind.web { color: var(--web); }
  .sources .where { color: var(--muted); }
  .sources .snippet { padding: 0 12px 10px; color: var(--muted); white-space: pre-wrap; }
  .sources a { color: var(--web); word-break: break-all; }
  .meta { margin-top: 6px; font-size: 0.75rem; color: var(--muted); }
  .error .bubble { border-color: var(--error); color: var(--error); }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; }
  .examples button { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
                     border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 0.86rem; cursor: pointer; }
  form { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0 20px; display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
                     background: var(--panel); color: var(--ink); font: inherit; }
  form button { padding: 0 18px; border: 0; border-radius: 12px; background: var(--accent);
                color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer; }
  form button:disabled { opacity: 0.5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .typing { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Noorderlicht Makelaars Assistant</h1>
    <p>Fictional company and listings · local demo. Answers can be wrong; check the cited sources.</p>
  <p>Messages and retrieved passages go to the selected model provider; optional web queries go to Tavily. Do not enter private information.</p>
  </header>
  <div id="log" aria-live="polite">
    <div class="examples" id="examples">
      <button>What commission do you charge to sell a home?</button>
      <button>Which rentals allow pets?</button>
      <button>Homes for sale in Utrecht under €500,000</button>
      <button>How does the bidding deadline work?</button>
    </div>
  </div>
  <form id="form">
    <input type="text" id="input" maxlength="2000" placeholder="Ask about fees, renting, or a listing…" autocomplete="off" aria-label="Your question" required>
    <button id="send">Send</button>
    <button type="button" id="clear">Clear</button>
  </form>
</main>
<script type="module" src="/static/chat.js"></script>
</body>
</html>
