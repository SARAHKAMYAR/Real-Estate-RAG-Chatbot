  question: What gross monthly income do I need to rent listing NL-2002?
  must_include: [["5775"]]
  sources: [[rental-policy.md], [NL-2002]]

- id: mix-03
  category: multi-step
  derived: true
  question: How much security deposit would I pay for the studio near Utrecht Science Park?
  must_include: [["2190"]]
