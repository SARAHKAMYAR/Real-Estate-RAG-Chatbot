# --- Multi-step: combine a document rule with a listing --------------------------------------
- id: mix-01
  category: multi-step
  derived: true
  question: If NL-1002 sells for exactly its asking price, what would your selling commission be?
  must_include: [["9301", "9302"]]
  sources: [[fees-and-commission.md], [NL-1002]]

- id: mix-02
  category: multi-step
