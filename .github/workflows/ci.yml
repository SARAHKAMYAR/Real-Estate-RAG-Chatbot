name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: realestate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/realestate
      REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: pip install uv==0.13.8
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev ruff check . && uv run --frozen --extra dev ruff format --check .
      - run: uv run --frozen --extra dev pytest -q
      - run: node --test tests/test_frontend.mjs
      - run: uv run --frozen python -m evals.run --retrieval-only --min-retrieval-hits 17
      - run: uv build
      - name: Audit locked dependency resolution
        run: |
          uv export --frozen --extra dev --no-emit-project --format requirements-txt -o audit-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit -r audit-requirements.txt --no-deps --disable-pip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: retrieval-results
          path: evals/results/
