name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: realestate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/realestate
      REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: pip install uv==0.13.8
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev ruff check . && uv run --frozen --extra dev ruff format --check .
      - run: uv run --frozen --extra dev pytest -q
      - run: node --test tests/test_frontend.mjs
      - run: uv run --frozen python -m evals.run --retrieval-only --min-retrieval-hits 17
      - run: uv build
      - name: Audit locked dependency resolution
        run: |
          uv export --frozen --extra dev --no-emit-project --format requirements-txt -o audit-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit -r audit-requirements.txt --no-deps --disable-pip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: retrieval-results
          path: evals/results/
