[project]
name = "real-estate-rag"
version = "1.1.0"
description = "Real estate chatbot that answers from company documents and listings, with cited sources and a scored eval set."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "anthropic>=1.0",
    "groq>=1.0",
    "fastembed>=0.4",
    "tavily-python>=0.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.setuptools.package-data]
app = ["schema.sql", "static/*", "data/*.json", "data/documents/*.md"]
evals = ["questions.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Postgres with ingested data"]

[tool.ruff]
line-length = 100
extend-exclude = [".env-local", ".pgdata", "build", "dist"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
